<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML基础</title>
</head>

<body>
    <h1>初学html</h1>
    <hr>
    <p>这是一个段落。</p>
    <p>这是另一个段落。</p>
    <p>这是第三个段落。</p>
    <h2>标签组成</h2>
    <p>符号：标签用<>尖括号表示</p>
    <p>组成：开始标签，内容和结束标签</p>
    <p>别称：标签也称元素</p>
    <h2>标签分类</h2>
    <p>大部分都是双标签</p>
    <p>少数单标签</p>
    <h2>开发技巧</h2>
    <p>直接写标签，后面回车就行</p>
    <!-- 注释，快捷键ctrl+/ -->
    <p>加粗<strong>文本</strong></p>
    <p>倾斜<em>文本</em></p>
    <p>下划线<ins>文本</ins></p>
    <p>删除线<del>文本</del></p>
    <!--块级元素-->
    <div>这是一个div块级元素</div>
    <p>这是一个段落块级元素</p>
    <h1>这是一个标题块级元素</h1>
    <video controls loop autoplay muted width="400">
        <source src="movie.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</body>

</html>
