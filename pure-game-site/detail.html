<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 详情页仍然复用同一套 CSS，保证多个页面视觉统一 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星穹游戏商城 - 游戏详情</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 详情页也使用相同的 app-shell 布局，左侧导航 + 右侧内容 -->
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">🎮 星穹商城</div>
      <div class="subtitle">Game Detail</div>
      <a class="nav-link" href="index.html">游戏列表</a>
      <a class="nav-link" href="profile.html">个人中心</a>
      <div class="version">v1.0.0</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>游戏详情</h1>
          <p>独立详情页，展示商品信息、价格、折扣与购买入口。</p>
        </div>
        <a class="outline link-button" href="index.html">返回首页</a>
      </header>

      <!-- 游戏详情容器：具体内容由 js/app.js 根据 URL 参数 id 动态生成 -->
      <section class="detail-page" id="detailPage"></section>
    </main>
  </div>
  <!-- 详情页同样需要 Toast，用于购买成功等提示 -->
  <div class="toast" id="toast"></div>
  <!-- 复用公共 JS：读取 detail.html?id=游戏ID 并渲染对应游戏详情 -->
  <script src="js/app.js"></script>
</body>
</html>
