<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 基础页面信息：字符集、移动端适配、浏览器标题和公共样式文件 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星穹游戏商城 - 首页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 整体外壳：左侧固定导航 + 右侧主内容区，是本网站的主要布局骨架 -->
  <div class="app-shell">
    <!-- 左侧导航栏：提供站点名称、页面跳转和主题切换入口 -->
    <aside class="sidebar">
      <div class="brand">🎮 星穹商城</div>
      <div class="subtitle">Pure HTML / CSS / JS</div>
      <a class="nav-link active" href="index.html">游戏列表</a>
      <a class="nav-link" href="profile.html">个人中心</a>
      <!-- 主题切换按钮由 js/app.js 绑定点击事件，用于演示 JavaScript 操作样式 -->
      <button class="nav-button" id="themeToggle">切换霓虹主题</button>
      <div class="version">v1.0.0</div>
    </aside>

    <main class="main">
      <!-- 顶部栏：展示页面标题、简介，以及当前登录用户信息 -->
      <header class="topbar">
        <div>
          <h1>游戏购物系统</h1>
          <p>深色科幻风格、真实游戏封面、筛选搜索、购物车与页面跳转。</p>
        </div>
        <div class="user-box">
          <span id="welcomeUser">欢迎，游客</span>
          <button class="outline" id="loginBtn">登录</button>
        </div>
      </header>

      <!-- 首页核心内容：左侧商品列表，右侧账户面板 -->
      <section class="store-layout">
        <!-- 商品列表区域：搜索框、分类按钮、游戏卡片都由 JavaScript 动态渲染 -->
        <div class="content-panel">
          <div class="toolbar">
            <!-- 搜索框：输入内容时触发 JS 过滤游戏列表 -->
            <input id="searchInput" type="search" placeholder="搜索游戏名称、类型或厂商...">
            <span id="gameCount">共 0 款游戏</span>
          </div>
          <!-- 分类按钮容器：由 app.js 根据 categories 数组生成 -->
          <div class="category-row" id="categoryRow"></div>
          <!-- 游戏卡片网格：由 app.js 根据 games 数据生成 -->
          <div class="game-grid" id="gameGrid"></div>
        </div>

        <!-- 右侧账户面板：展示余额、充值按钮、个人中心入口和迷你购物车 -->
        <aside class="account-panel">
          <div class="avatar">星</div>
          <h2 id="sideUser">游客</h2>
          <p>@nebula-player</p>
          <div class="balance">￥<span id="balanceText">9999.00</span></div>
          <button class="success" id="rechargeBtn">充值 1000</button>
          <a class="wide-link" href="profile.html">查看个人中心</a>
          <div class="mini-cart">
            <h3>购物车</h3>
            <div id="miniCartList"></div>
            <button class="primary" id="checkoutBtn">结算</button>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <!-- 登录弹窗：默认隐藏，点击“登录”按钮后由 JS 移除 hidden 类显示 -->
  <div class="modal hidden" id="loginModal">
    <div class="modal-card">
      <button class="close" id="closeModal">×</button>
      <h2>账户登录</h2>
      <input id="usernameInput" placeholder="用户名" value="admin">
      <input id="passwordInput" type="password" placeholder="密码" value="123456">
      <button class="primary" id="submitLogin">登录</button>
      <p>演示账户：admin / 123456</p>
    </div>
  </div>

  <!-- Toast 提示框：用于显示“登录成功 / 加入购物车 / 支付成功”等短提示 -->
  <div class="toast" id="toast"></div>
  <!-- 公共 JavaScript：负责数据渲染、交互、localStorage 状态保存 -->
  <script src="js/app.js"></script>
</body>
</html>
